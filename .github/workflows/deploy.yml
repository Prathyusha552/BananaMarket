
name: Deploy BananaMarket React App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Build project
        working-directory: ./Frontend
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Frontend/dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
