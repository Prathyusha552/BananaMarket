
# ==========================================
# BANANA MARKET - APPLICATION CONFIGURATION
# ==========================================

spring.application.name=BananaMarket

# ==========================================
# DATABASE CONNECTION
# ==========================================

# Local SQLite database by default.
# When deployed online, DATABASE_URL can override this path.

spring.datasource.url=${DATABASE_URL:jdbc:sqlite:E:/BannanMarket/database/banana_market.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# Disable automatic SQL initialization
spring.sql.init.mode=never

# ==========================================
# SERVER CONFIGURATION
# ==========================================

server.port=${PORT:8080}

# ==========================================
# LOGGING
# ==========================================

logging.level.org.springframework.jdbc=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.jdbc.support=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.bananamarket=DEBUG

# ==========================================
# ERROR CONFIGURATION
# ==========================================

server.error.include-message=always
